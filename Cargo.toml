[package]
name = "cerf"
authors = ["CerfSh"]
version = "0.3.2"
description = "A shell."
edition = "2024"
repository = "https://github.com/cerfsh/cerf"
license = "Apache-2.0"
keywords = ["cerf", "shell", "codetease", "terminal", "command-line"]
categories = ["command-line-utilities"]
rust-version = "1.100.0"
include = ["src/**/*", "Cargo.toml", "LICENSE", "README.md"]

[dependencies]
axum = "0.8"
dirs = "7.0.0"
glob = "0.3"
nom = "8.0.0"
rustyline = "19"
same-file = "1.0"
sysinfo = "0.40"
jwalk = "0.9.0"
chrono = "0.4.39"
reqwest = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2.5.8"
hickory-resolver = "0.25"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", features = ["fs", "signal", "process", "term"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
] }

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
